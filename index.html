      font-size: 13px;
      cursor: pointer;

    .legend-btn { padding: 9px 14px; border-radius: 8px; border: 1px solid rgba(142,45,226,0.35); background: rgba(255,255,255,0.07); color: #b0a8d8; font-size: 13px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }

      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const raw = Array.isArray(parsed) ? parsed : parsed.caught;
          if (!Array.isArray(raw)) throw new Error("bad");
          const ids = [...new Set(raw.map(Number).filter(n => VALID_IDS.has(n)))];
          const added = ids.filter(id => !caught.has(id));
          if (!ids.length) { alert("That file has no ticked Pokémon in it. Nothing was changed."); return; }
          if (!added.length) { alert("Nothing new to add: everything ticked in that file is already ticked here. Your progress is unchanged."); return; }
          if (!confirm(`Add ${added.length} newly ticked Pokémon from the file?\n\nYour ${caught.size} current ticks stay ticked. Import only adds, it never removes.`)) return;
          added.forEach(id => caught.add(id));
          save();
          updateProgress();
          render();
        } catch { alert("Couldn't read that file. Make sure it's an export from this app."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    document.getElementById("btn-imgs").textContent = "Images: " + (imagesOn ? "On" : "Off");
    document.getElementById("btn-imgs").addEventListener("click", e => {
      imagesOn = !imagesOn;
      e.currentTarget.textContent = "Images: " + (imagesOn ? "On" : "Off");
      saveUI();
      render();
    });

    document.querySelectorAll(".dex-btn").forEach(b => b.addEventListener("click", () => {
      dexView = b.dataset.dex;
      saveUI();
      render();
    }));

    render();

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
